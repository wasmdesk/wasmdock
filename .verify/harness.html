<!doctype html>
<html>
<head><meta charset="utf-8"><title>wasmdock harness</title>
<style>body{margin:0;background:#3a5a8c}#c{display:block}</style>
</head>
<body>
<!-- A desktop-colored backdrop so the dock's chrome reads. -->
<canvas id="c" width="480" height="120"></canvas>
<script src="../wasm_exec.js"></script>
<script>
// Standalone harness: stand in for the wasmbox compositor so we can drive the
// dock's real wasm main() and capture the surface. It stubs the SDK surface the
// dock reads (commit / onInput / beginFrame / launch / focus / closeWindow /
// setWorkspace / setTheme / openPopup), so the real event flow runs without a
// live compositor.
//
// We use a plain ArrayBuffer-backed Uint8ClampedArray (NOT a SharedArrayBuffer)
// so the page needs no COOP/COEP headers — main.go only CopyBytesToJS into
// `pixels`, which works on any typed array. Only the transport differs.
"use strict";
window.__launches = [];
window.__focuses = [];
window.__closes = [];
window.__popups = [];

const W = 480, H = 120;
const pixels = new Uint8ClampedArray(4 * W * H);

let inputCb = null;
let popupInputCb = null, popupWelcomeCb = null;
const client = {
  w: W, h: H, pixels: pixels, windowId: 1,
  commit: function () { window.__committed = (window.__committed | 0) + 1; },
  beginFrame: function () {},
  onInput: function (fn) { inputCb = fn; window.__inputReady = true; },
  launch: function (app) { window.__launches.push(String(app)); },
  focus: function (id) { window.__focuses.push(id | 0); },
  closeWindow: function (id) { window.__closes.push(id | 0); },
  setWorkspace: function () {},
  setTheme: function () {},
  // openPopup returns a stub popup surface the dock paints its context menu
  // into; we record the request + expose the popup so the drive script can
  // click a menu item.
  openPopup: function (opts) {
    const pw = opts.w | 0, ph = opts.h | 0;
    const pp = {
      w: pw, h: ph, pixels: new Uint8ClampedArray(4 * pw * ph),
      commit: function () { window.__popupCommits = (window.__popupCommits | 0) + 1; },
      beginFrame: function () {},
      onWelcome: function (fn) { popupWelcomeCb = fn; setTimeout(() => fn({}), 0); },
      onInput: function (fn) { popupInputCb = fn; },
      onClosed: function () {},
      requestClose: function () { window.__popupClosed = true; },
    };
    window.__popups.push({ w: pw, h: ph, rel_x: opts.rel_x | 0, rel_y: opts.rel_y | 0, popup: pp });
    window.__lastPopup = pp;
    return pp;
  },
};
window.wasmboxClient = client;

function readPixels(view, w, h) {
  const tmp = document.createElement("canvas");
  tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext("2d");
  ctx.putImageData(new ImageData(new Uint8ClampedArray(view), w, h), 0, 0);
  return ctx.getImageData(0, 0, w, h).data;
}
function blit() {
  const ctx = document.getElementById("c").getContext("2d");
  ctx.fillStyle = "#3a5a8c";
  ctx.fillRect(0, 0, W, H);
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  tmp.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(pixels), W, H), 0, 0);
  ctx.drawImage(tmp, 0, 0);
  window.__blitted = true;
}

const go = new Go();
WebAssembly.instantiateStreaming(fetch("../dock.wasm"), go.importObject)
  .then((res) => {
    go.run(res.instance);            // main() renders once + registers onInput
    setTimeout(() => {
      blit();                        // resting dock
      window.__geomRest = JSON.parse(JSON.stringify(window.__wasmdockGeometry || {}));
      if (inputCb) {
        // Hover launcher 0's centre to trigger magnification.
        const g = window.__wasmdockGeometry;
        const b0 = g && g.launchers && g.launchers[0];
        const hx = b0 ? (b0.x + (b0.w >> 1)) : 130;
        const hy = b0 ? (b0.y + (b0.h >> 1)) : 60;
        inputCb({ kind: "mousemove", x: hx, y: hy });
        blit();
        window.__geomHover = JSON.parse(JSON.stringify(window.__wasmdockGeometry || {}));
        // Left-click the hovered launcher -> a launch fires.
        inputCb({ kind: "mousedown", x: hx, y: hy, button: 0 });
        // Right-click the same launcher -> a context menu popup opens.
        inputCb({ kind: "mousedown", x: hx, y: hy, button: 2 });
        // Drive a click on the popup's first menu row (New Window -> launch).
        setTimeout(() => {
          if (popupInputCb) {
            popupInputCb({ kind: "mousemove", x: 10, y: 12 });
            popupInputCb({ kind: "mousedown", x: 10, y: 12, button: 0 });
          }
          window.__done = true;
        }, 20);
      } else {
        window.__done = true;
      }
    }, 150);
  })
  .catch((e) => { window.__error = String(e); });
</script>
</body>
</html>
